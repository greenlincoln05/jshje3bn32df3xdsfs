# All tunables live here. The Kalshi environment and credentials do NOT: see .env.example.
mode: paper                 # paper | demo | live  (live needs extra gates, see README)
series_ticker: KXBTC15M
spot_feeds: [coinbase]
vol_window_sec: 900
vol_method: ewma
model_blend: 0.5
min_edge: 0.04
min_depth: 10
max_spread: 0.06
min_tau_sec: 30
max_tau_sec: 780
cancel_before_close_sec: 20
min_price: 0.15               # refuse to enter outside [min_price, max_price]; null disables one side
max_price: 0.85                # a reasoned starting guardrail, not backtested -- tune with `btcbot lab`
sizing:
  contracts_per_trade: 5
  mode: fixed                  # fixed | kelly (fractional Kelly on risk.max_open_exposure_usd)
  kelly_fraction_multiplier: 0.2
  # mode: percent  -> stake risk_pct_per_trade % of the CURRENT account per order. The account starts at
  # account_usd and moves only with SETTLED profit and loss; after a win the next order may grow by at most
  # max_growth_per_win_pct %, after a loss it can never grow. Pair it with the two account-relative risk limits
  # below so the caps rise and fall with the account. (Defaults shown; percent mode is off unless you set it.)
  account_usd: 500
  risk_pct_per_trade: 2
  max_growth_per_win_pct: 20
risk:
  max_contracts_per_trade: 10
  max_open_exposure_usd: 25
  daily_loss_limit_usd: 20
  max_consecutive_losses: 5
  max_trades_per_hour: 12
