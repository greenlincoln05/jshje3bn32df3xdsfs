[build-system]
requires = ["hatchling>=1.24"]
build-backend = "hatchling.build"

[project]
name = "btcbot"
version = "0.1.0"
description = "Paper-first bot for Kalshi's rolling 15-minute BTC up/down markets (KXBTC15M)"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "httpx>=0.27",
    "cryptography>=42",
    "pydantic>=2.6",
    "pydantic-settings>=2.2",
    "pyyaml>=6.0",
    "websockets>=13",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "pytest-asyncio>=0.23",
]

[project.scripts]
btcbot = "btcbot.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/btcbot"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
